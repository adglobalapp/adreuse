name: Docker image (backend)

# A backend minden main-re kerülő változásánál elkészül az image (ARM64 a Pi-nek + amd64),
# és felkerül a GitHub Container Registry-be: ghcr.io/adglobalapp/adreuse-backend
# Titkot nem tartalmaz: APP_KEY, DB, SMTP és Turnstile futáskor env-ből jön.
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/docker-backend.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/adglobalapp/adreuse-backend:latest
            ghcr.io/adglobalapp/adreuse-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
