; Feltöltés: a képek max. 5 MB-osak (validáció), a határ ennél lazább
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; az image nem változik futás közben, a fájlokat nem kell újraellenőrizni
opcache.validate_timestamps = 0
