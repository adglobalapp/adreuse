server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;
    server_tokens off;

    # Biztonsági fejlécek: az API JSON-t és képeket ad, semmit nem kell beágyazni vagy futtatni
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Feltöltött képek (public/storage → storage/app/public)
    location /storage/ {
        expires 30d;
        # (nginx-ben a location saját add_header-je felülírja a szerver szintűeket, ezért itt újra)
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Csak a belépési pont futtathat PHP-t (a feltöltött fájlok soha)
    location ~ ^/(?!index\.php$).+\.php$ {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
