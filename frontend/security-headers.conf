# Biztonsági fejlécek – minden location-ben be kell húzni (include), mert az
# add_header egy location-ön belül felülírja a server szintűeket.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: csak saját szkript + Cloudflare Turnstile (spamvédelem) + Cloudflare Web Analytics.
# Az API-cím (api.adreuse.uk) itt rögzített – ha a VITE_*API_URL változik, ezt is frissíteni kell.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.adreuse.uk https://cloudflareinsights.com; img-src 'self' data: blob: https://api.adreuse.uk; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
