server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # A buildelt fájlnevek tartalom-hash-t tartalmaznak, sokáig cache-elhetők
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # SPA: minden ismeretlen útvonal az index.html-t kapja (pl. /listings/5 frissítéskor)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
